<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Aluno</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#b3003b;
            min-height:100vh;
        }

        header{
            width:100%;
            background:#5c001f;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header img{
            width:140px;
        }

        .logout{
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:white;
            color:#5c001f;
            font-weight:bold;
            cursor:pointer;
        }

        .container{
            padding:50px;
        }

        .titulo{
            color:white;
            margin-bottom:10px;
            font-size:42px;
        }

        .subtitulo{
            color:#ffe5ee;
            margin-bottom:40px;
            font-size:18px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            color:#5c001f;
            margin-bottom:15px;
        }

        .card p{
            color:#555;
            margin-bottom:10px;
        }

        .status{
            color:green;
            font-weight:bold;
        }

        .certificado{
            margin-top:20px;
            padding:12px;
            border:none;
            border-radius:12px;
            background:#b3003b;
            color:white;
            cursor:pointer;
            width:100%;
            font-weight:bold;
        }

        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            justify-content:center;
            align-items:center;
        }

        .modal-content{
            background:white;
            width:700px;
            border-radius:20px;
            padding:40px;
            text-align:center;
        }

        .modal-content h1{
            color:#5c001f;
            margin-bottom:20px;
        }

        .modal-content p{
            margin-bottom:15px;
            font-size:18px;
        }

        .fechar{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:#b3003b;
            color:white;
            cursor:pointer;
        }
    </style>
</head>

<body>

<header>
    <img src="img.png" alt="Logo ESPM">

    <button class="logout" onclick="logout()">
        SAIR
    </button>
</header>

<div class="container">

    <h1 class="titulo">Área do Aluno</h1>

    <p class="subtitulo">
        Visualize seus cursos e certificados.
    </p>

    <div class="cards" id="listaCursos"></div>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <h1>Certificado de Aprovação</h1>

        <p>
            Certificamos que o aluno:
        </p>

        <p id="nomeAluno"></p>

        <p>
            concluiu com sucesso o curso:
        </p>

        <p id="nomeCurso"></p>

        <p id="codigoCertificado"></p>

        <p id="dataCertificado"></p>

        <button class="fechar" onclick="fecharModal()">
            FECHAR
        </button>

    </div>

</div>

<script>

    const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));

    if (!usuarioLogado || usuarioLogado.tipo !== "ALUNO") {
        alert("Acesso negado!");
        window.location.href = "index.html";
    }

    async function carregarCursos() {

        const respostaCursos = await fetch("/cursos");
        const cursos = await respostaCursos.json();

        const respostaCertificados = await fetch("/certificados");
        const certificados = await respostaCertificados.json();

        const lista = document.getElementById("listaCursos");

        lista.innerHTML = "";

        cursos.forEach((curso, index) => {

            const certificado = certificados[index];

            lista.innerHTML += `
                <div class="card">

                    <h2>${curso.titulo}</h2>

                    <p>
                        <strong>Carga horária:</strong>
                        ${curso.cargaHoraria} horas
                    </p>

                    <p>
                        <strong>Status:</strong>
                        <span class="status">${curso.status}</span>
                    </p>

                    <button class="certificado"
                        onclick='abrirCertificado(
                            "${curso.titulo}",
                            "${certificado.codigoValidacao}",
                            "${certificado.dataEmissao}"
                        )'>

                        VER CERTIFICADO

                    </button>

                </div>
            `;
        });
    }

    function abrirCertificado(curso, codigo, data) {

        document.getElementById("modal").style.display = "flex";

        document.getElementById("nomeAluno").innerHTML =
            "<strong>" + usuarioLogado.nome + "</strong>";

        document.getElementById("nomeCurso").innerHTML =
            "<strong>" + curso + "</strong>";

        document.getElementById("codigoCertificado").innerHTML =
            "Código de validação: <strong>" + codigo + "</strong>";

        document.getElementById("dataCertificado").innerHTML =
            "Data de emissão: <strong>" + data + "</strong>";
    }

    function fecharModal() {
        document.getElementById("modal").style.display = "none";
    }

    function logout() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    carregarCursos();

</script>

</body>
</html>
