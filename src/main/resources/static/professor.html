<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Professor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#b3003b;
            min-height:100vh;
        }

        header{
            width:100%;
            background:#5c001f;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header img{
            width:140px;
        }

        .logout{
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:white;
            color:#5c001f;
            font-weight:bold;
            cursor:pointer;
        }

        .container{
            padding:50px;
        }

        .titulo{
            color:white;
            font-size:42px;
            margin-bottom:10px;
        }

        .subtitulo{
            color:#ffe5ee;
            margin-bottom:40px;
            font-size:18px;
        }

        .cards{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:20px;
            padding:30px;
            box-shadow:0 10px 20px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card h2{
            color:#5c001f;
            margin-bottom:15px;
        }

        .card p{
            color:#555;
            margin-bottom:10px;
        }

        .status{
            color:green;
            font-weight:bold;
        }

        .btn{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:12px;
            background:#b3003b;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.7);
            justify-content:center;
            align-items:center;
        }

        .modal-content{
            width:800px;
            background:white;
            border-radius:20px;
            padding:40px;
        }

        .modal-content h1{
            color:#5c001f;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        table th{
            background:#5c001f;
            color:white;
            padding:15px;
            text-align:left;
        }

        table td{
            padding:15px;
            border-bottom:1px solid #ddd;
        }

        .aprovado{
            color:green;
            font-weight:bold;
        }

        .fechar{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:30px;
            background:#b3003b;
            color:white;
            cursor:pointer;
        }

    </style>

</head>

<body>

<header>

    <img src="img.png" alt="Logo ESPM">

    <button class="logout" onclick="logout()">
        SAIR
    </button>

</header>

<div class="container">

    <h1 class="titulo">
        Área do Professor
    </h1>

    <p class="subtitulo">
        Visualize os alunos cadastrados e suas aprovações.
    </p>

    <div class="cards" id="listaAlunos"></div>

</div>

<div class="modal" id="modal">

    <div class="modal-content">

        <h1 id="tituloAluno"></h1>

        <table>

            <thead>
            <tr>
                <th>Curso</th>
                <th>Status</th>
                <th>Resultado</th>
            </tr>
            </thead>

            <tbody id="tabelaCursos"></tbody>

        </table>

        <button class="fechar" onclick="fecharModal()">
            FECHAR
        </button>

    </div>

</div>

<script>

    const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));

    if (!usuarioLogado || usuarioLogado.tipo !== "PROFESSOR") {
        alert("Acesso negado!");
        window.location.href = "index.html";
    }

    let cursosGlobais = [];

    async function carregarDados() {

        const respostaUsuarios = await fetch("/usuarios");
        const usuarios = await respostaUsuarios.json();

        const respostaCursos = await fetch("/cursos");
        cursosGlobais = await respostaCursos.json();

        const alunos = usuarios.filter(usuario =>
            usuario.tipo === "ALUNO"
        );

        const lista = document.getElementById("listaAlunos");

        lista.innerHTML = "";

        alunos.forEach(aluno => {

            lista.innerHTML += `
                <div class="card">

                    <h2>${aluno.nome}</h2>

                    <p>
                        <strong>Email:</strong>
                        ${aluno.email}
                    </p>

                    <p class="status">
                        Aluno aprovado
                    </p>

                    <button class="btn"
                        onclick='visualizarAluno("${aluno.nome}")'>

                        VER DESEMPENHO

                    </button>

                </div>
            `;
        });
    }

    function visualizarAluno(nomeAluno) {

        document.getElementById("modal").style.display = "flex";

        document.getElementById("tituloAluno").innerHTML =
            "Desempenho de " + nomeAluno;

        const tabela = document.getElementById("tabelaCursos");

        tabela.innerHTML = "";

        cursosGlobais.forEach(curso => {

            tabela.innerHTML += `
                <tr>
                    <td>${curso.titulo}</td>

                    <td class="aprovado">
                        ${curso.status}
                    </td>

                    <td>
                        ${nomeAluno} foi aprovado no curso
                        ${curso.titulo}.
                    </td>
                </tr>
            `;
        });
    }

    function fecharModal() {
        document.getElementById("modal").style.display = "none";
    }

    function logout() {
        localStorage.removeItem("usuarioLogado");
        window.location.href = "index.html";
    }

    carregarDados();

</script>

</body>
</html>
